server.port=8081
spring.application.name=complaint-service

# Inter-service REST call target (analysis-service)
analysis.service.url=http://localhost:8082

# Database: H2 in-memory (zero setup). Console at http://localhost:8081/h2-console
spring.datasource.url=jdbc:h2:mem:cybercrime;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- To use MySQL instead: add mysql-connector-j to pom.xml and replace the datasource lines with:
# spring.datasource.url=jdbc:mysql://localhost:3306/cybercrime?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=yourpassword
